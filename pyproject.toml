[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nurus"
version = "0.3.0.dev3"
description = "Flujo local de revisión y generación para CSMP"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "openpyxl>=3.1,<4", "python-docx>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
excel-legacy = ["xlrd>=2.0.1"]
excel-native = ["pywin32>=306; platform_system == 'Windows'"]
outlook = ["pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
nurus = "nurus.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"nurus.rus" = ["*.json"]
"nurus.services" = ["*.json"]
