[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nurus"
version = "0.4.0.dev9"
description = "CSMP personal: Excel, proyectos Word y borradores desde un trabajo compartido"
requires-python = ">=3.12,<3.15"
dependencies = ["pandas>=2.2,<3", "openpyxl>=3.1,<4", "python-docx>=1.1,<2", "lxml>=4.9,<7", "docxcompose>=1.4,<3", "customtkinter>=5.2.2,<6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
excel-legacy = ["xlrd>=2.0.1"]
excel-native = ["pywin32>=306; platform_system == 'Windows'"]
outlook = ["pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
nurus = "nurus.personal.app:main"
csmp-assistant = "nurus.personal.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"nurus.rus" = ["*.json"]
"nurus.services" = ["*.json"]
"nurus.personal" = ["*.json", "matrix_patches/*.b64", "plantillas_word/*/*.docx"]
