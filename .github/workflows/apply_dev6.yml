name: Apply CSMP dev6 correction

on:
  push:
    branches:
      - csmp-personal-2026-09-13
    paths:
      - tools/apply_dev6.py
      - .github/workflows/apply_dev6.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: csmp-personal-2026-09-13
          fetch-depth: 0
      - name: Apply corrections
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_dev6.py
          python -m compileall -q src tests tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nurus/personal/outputs.py src/nurus/personal/importing.py src/nurus/personal/resolutions.py tests/test_personal_batch_revision.py
          git commit -m "Fix mail attachments and resolution case recognition"
          git push origin HEAD:csmp-personal-2026-09-13
