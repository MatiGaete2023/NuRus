name: NuRus tests

on:
  push:
    branches:
      - main
      - implementacion-plan-2026-09-08
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,excel-legacy]"

      - name: Dependency check
        run: python -m pip check

      - name: Legacy Excel dependency
        run: python -c "import xlrd; print(xlrd.__version__)"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Tests
        run: python -m pytest -q
