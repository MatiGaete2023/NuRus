name: CSMP Assistant Windows

on:
  push:
    branches:
      - main
      - csmp-personal-2026-09-13
      - csmp-ux-20260921
      - ux-observaciones-20260922
      - 'codex/**'
      - 'experimento/**'
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install ".[dev,excel-legacy,excel-native,outlook]"

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Verify installed package outside source path
        run: >-
          python -I -c "import tempfile; from pathlib import Path;
          import nurus; from importlib.metadata import version;
          from nurus.rus.catalog import load_catalog;
          from nurus.storage.database import Database;
          from nurus.personal.template_package import _matrix_patches; import nurus.personal as personal;
          assert nurus.__version__ == version('nurus'); assert load_catalog();
          assert len(_matrix_patches()) == 5;
          template_root = Path(personal.__file__).parent / 'plantillas_word';
          expected = {'LAJA/NOMENCL.docx','LAJA/PC_IE.docx','LAJA/PC_INFO.docx','MULCHEN/NOMENCL.docx','MULCHEN/PC_IE.docx','MULCHEN/PC_INFO.docx'};
          actual = {p.relative_to(template_root).as_posix() for p in template_root.rglob('*.docx')}; assert actual == expected;
          folder = tempfile.TemporaryDirectory(); db = Database(Path(folder.name) / 'check.sqlite3');
          assert db.list_templates(); print(nurus.__version__, 'installed resources OK; 5 patches and 6 templates verified'); folder.cleanup()"

      - name: Dependency check
        run: python -m pip check

      - name: Legacy Excel dependency
        run: python -c "import xlrd; print(xlrd.__version__)"

      - name: Native Excel/Outlook dependency on Windows
        run: python -c "import win32com.client; print('pywin32 OK')"

      - name: Compile
        run: python -m compileall -q src tests tools

      - name: Personal GUI smoke
        timeout-minutes: 2
        if: matrix.python == '3.12'
        run: python tools/smoke_personal_gui.py

      - name: Tests
        timeout-minutes: 8
        run: python -m pytest -q -o faulthandler_timeout=90

      - name: Fictitious end-to-end products and interface
        if: matrix.python == '3.12'
        run: python tools/showcase_products.py

      - name: RUS capture in Chromium with a fictitious form
        if: matrix.python == '3.12'
        timeout-minutes: 4
        run: |
          python -m pip install "playwright>=1.50,<2"
          if ($LASTEXITCODE -ne 0) { throw 'Falló la instalación de Playwright' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falló la instalación de Chromium' }
          python tools/smoke_rus_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló la comprobación de captura RUS' }

      - name: Windows interface captures
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: CSMP-Windows-interface
          path: artifacts/*.png
          if-no-files-found: ignore

      - name: Build Windows distribution
        if: matrix.python == '3.12'
        shell: pwsh
        run: git archive --format=zip --prefix=CSMP_Assistant/ -o dist/CSMP_Assistant_personal_0.5.0-dev4.zip HEAD

      - name: Source distribution
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: CSMP-Windows-dev4
          path: dist/CSMP_Assistant_personal_0.5.0-dev4.zip

      - name: Windows executable
        if: matrix.python == '3.12'
        run: |
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Falló la instalación del empaquetador' }
          python -m PyInstaller --noconfirm CSMP_Experimental.spec
          if ($LASTEXITCODE -ne 0) { throw 'Falló la construcción del ejecutable CSMP' }
          $check = Start-Process -FilePath (Resolve-Path dist/CSMP_Integral/CSMP_Integral.exe).Path -ArgumentList '--verificar-paquete','artifacts/package-check.json' -PassThru -Wait -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Falló la comprobación del paquete CSMP' }
          $proof = Get-Content artifacts/package-check.json -Raw | ConvertFrom-Json
          if (-not $proof.ok -or -not $proof.frozen) { throw 'El paquete CSMP no confirmó su arranque' }
          python -m PyInstaller --noconfirm --onefile --windowed --paths src --name RUS_Inspector tools/rus_inspector_entry.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló la construcción del inspector RUS' }
          New-Item -ItemType Directory -Force dist/RUS_Registro_Actual | Out-Null
          Copy-Item dist/RUS_Inspector.exe dist/RUS_Registro_Actual/
          Copy-Item -Recurse tools/rus_capture_extension dist/RUS_Registro_Actual/
          Copy-Item docs/REGISTRO_RUS_AVANCE_20261006.md dist/RUS_Registro_Actual/

      - name: RUS inspector and Chrome capture extension
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: RUS-Registro-Actual-Windows
          path: dist/RUS_Registro_Actual/
          if-no-files-found: error

      - name: Verificar lector y empaquetado integral SITFA
        if: matrix.python == '3.12'
        shell: pwsh
        run: |
          python -m pip install -r descargador/requirements.txt playwright==1.63.0
          if ($LASTEXITCODE -ne 0) { throw 'Dependencias descargador' }
          python -m pytest descargador -q
          if ($LASTEXITCODE -ne 0) { throw 'Pruebas descargador' }
          node descargador/test_bitacoras_extension.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pruebas extensión' }
          ./tools/build_integral.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Falló paquete CSMP-Descargador' }

      - name: Artefacto integral CSMP y Descargador
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: CSMP-Descargador-Integral-dev4
          path: dist/integral/
          if-no-files-found: error

      - name: Executable artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: CSMP-Integral-Windows-dev4
          path: dist/CSMP_Integral/
          if-no-files-found: error

      - name: Wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nurus-wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/*.whl

      - name: Measure native table redraws
        if: matrix.python == '3.12'
        run: python tools/benchmark_interface.py --rows 1000 10000 --repeats 10

      - name: Build and verify Windows installer
        if: matrix.python == '3.12'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falló la instalación de Inno Setup' }
            $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $compiler) { throw 'No se encuentra Inno Setup' }
          & $compiler installer/CSMP.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falló la construcción del instalador' }
          $installer = Get-ChildItem dist/Instalar_CSMP_*_Windows.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'CSMP instalado'
          $install = Start-Process $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$destination+'"') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Falló la instalación silenciosa' }
          $dataFolder = Join-Path $env:LOCALAPPDATA 'CSMP_Personal_Prototipo_Integral'
          New-Item -ItemType Directory -Force $dataFolder | Out-Null
          $sentinel = Join-Path $dataFolder ('installer-test-'+[guid]::NewGuid().ToString()+'.txt')
          Set-Content $sentinel 'conservar'
          $check = Start-Process (Join-Path $destination 'CSMP_Integral.exe') -ArgumentList '--verificar-paquete','artifacts/installed-package-check.json' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Falló el arranque instalado' }
          $reinstall = Start-Process $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$destination+'"') -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) { throw 'Falló la reinstalación' }
          $uninstall = Start-Process (Join-Path $destination 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Falló la desinstalación' }
          if (-not (Test-Path $sentinel) -or (Get-Content $sentinel) -ne 'conservar') { throw 'Se alteraron los datos de usuario' }
          Remove-Item $sentinel

      - name: Installer and measurements
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: CSMP-Instalador-Windows-dev4
          path: |
            dist/Instalar_CSMP_*_Windows.exe
            artifacts/performance.json
            artifacts/installed-package-check.json
            artifacts/productos-ficticios/
