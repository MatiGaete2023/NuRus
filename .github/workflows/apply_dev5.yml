name: Apply CSMP dev5 correction

on:
  push:
    branches:
      - csmp-personal-2026-09-13
    paths:
      - tools/dev5.patch
      - .github/workflows/apply_dev5.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: csmp-personal-2026-09-13
          fetch-depth: 0
      - name: Apply reviewed correction
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' tools/dev5.patch
          git apply --check --exclude=.github/workflows/tests.yml --ignore-space-change --whitespace=nowarn tools/dev5.patch
          git apply --exclude=.github/workflows/tests.yml --ignore-space-change --whitespace=nowarn tools/dev5.patch
          python -m compileall -q src tests tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Respect reviewed resolution selection and pair NNA identities"
          git push origin HEAD:csmp-personal-2026-09-13
