name: Descargador integral y bitácoras
on:
  push:
    branches: ['experimento/**', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descargador:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: descargador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pytest pyinstaller playwright==1.63.0
      - run: python -m pytest -q -p no:cacheprovider
      - run: node test_bitacoras_extension.cjs
      - name: Extensión y servidor ficticios
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falló Chromium de pruebas' }
          python verificar_bitacoras_extension.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló la lectura ficticia desde la extensión' }
          python verificar_pdf_extension.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló la evidencia PDF con extensión real' }
      - name: Ejecutable y contrato compartido
        run: |
          python ../tools/write_build_meta.py --descargador .
          if ($LASTEXITCODE -ne 0) { throw 'Falló la identificación del paquete' }
          python -m PyInstaller --noconfirm SITFA_Descargador.spec
          if ($LASTEXITCODE -ne 0) { throw 'Falló el empaquetado' }
          $p = Start-Process -FilePath (Resolve-Path dist/SITFA_Descargador/SITFA_Descargador.exe).Path -ArgumentList '--verificar-paquete','artifacts/package-check.json' -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Falló la verificación del ejecutable' }
          $proof = Get-Content artifacts/package-check.json -Raw | ConvertFrom-Json
          if (-not $proof.ok -or -not $proof.bitacora_button_verified -or -not $proof.shared_bitacora_parser_verified) { throw 'Paquete incompleto' }
      - uses: actions/upload-artifact@v4
        with:
          name: Descargador-SITFA-2.7.0-Windows
          path: descargador/dist/SITFA_Descargador/
          if-no-files-found: error
